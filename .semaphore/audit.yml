version: v1.0
name: ETEngine Audit
agent:
  machine:
    type: e1-standard-2
    os_image: ubuntu2404
blocks:
  - name: Brakeman
    task:
      env_vars:
        - name: RAILS_ENV
          value: test
      prologue:
        commands:
          - checkout
          - sudo apt-get update
          - cache restore
          - gem install brakeman
          - gem install bundle-audit
          - cache store
      jobs:
        - name: Brakeman
          commands:
            - 'brakeman -f junit -o report && test-results publish report.xml'
        - name: Bundler
          commands:
            - bundle-audit
after_pipeline:
  task:
    jobs:
      - name: Merge reports
        commands:
          - test-results gen-pipeline-report
